<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=300,height=250,initial-scale=1">
  <meta name="ad.size" content="width=300,height=250">

  <title>AuraSound Pro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 300px;
      height: 250px;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    .banner {
      position: relative;

      width: 300px;
      height: 250px;

      padding: 12px;

      overflow: hidden;

      cursor: pointer;

      color: #29292d;

      background:
        radial-gradient(
          circle at 18% 70%,
          rgba(255, 255, 255, .95) 0,
          rgba(255, 255, 255, 0) 38%
        ),
        linear-gradient(
          135deg,
          #fffdf8 0%,
          #f7f1e7 100%
        );

      isolation: isolate;
    }

    .banner::before {
      content: "";

      position: absolute;
      inset: 0;

      border: 1px solid rgba(80, 70, 55, .05);

      pointer-events: none;

      z-index: 20;
    }

    .glow {
      position: absolute;

      width: 125px;
      height: 125px;

      left: -25px;
      top: 92px;

      border-radius: 50%;

      background: rgba(132, 126, 215, .13);

      filter: blur(28px);

      pointer-events: none;
    }

    .glow-right {
      position: absolute;

      width: 100px;
      height: 100px;

      right: -55px;
      top: -35px;

      border-radius: 50%;

      background: rgba(154, 146, 226, .12);

      filter: blur(25px);

      pointer-events: none;
    }

    .discount {
      position: absolute;

      left: 12px;
      top: 12px;

      width: 54px;
      height: 31px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 6px;

      background: #8984d4;

      color: #fff;

      font-size: 17px;
      font-weight: 800;

      letter-spacing: -.5px;

      z-index: 10;

      opacity: 0;

      transform: translateY(-8px) scale(.94);

      animation:
        badgeIn .55s cubic-bezier(.2, .8, .2, 1) .45s forwards;

      box-shadow:
        0 5px 16px rgba(111, 103, 192, .18);
    }

    @keyframes badgeIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .product-area {
      position: absolute;

      left: -1px;
      top: 48px;

      width: 140px;
      height: 180px;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 2;

      opacity: 0;

      transform: translateY(10px) scale(.88);

      animation:
        productIn .9s cubic-bezier(.18, .8, .2, 1) .05s forwards,
        productFloat 4s ease-in-out 1.05s infinite;
    }

    .product {
      display: block;

      width: 180px;
      height: 180px;

      object-fit: contain;

      filter:
        drop-shadow(0 12px 10px rgba(55, 45, 35, .12));

      user-select: none;

      -webkit-user-drag: none;
    }

    @keyframes productIn {
      0% {
        opacity: 0;
        transform: translateY(12px) scale(.86);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes productFloat {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-3px) scale(1.012);
      }
    }

    .product-shadow {
      position: absolute;

      left: 25px;
      bottom: 10px;

      width: 90px;
      height: 9px;

      border-radius: 50%;

      background: rgba(62, 54, 44, .12);

      filter: blur(5px);

      opacity: 0;

      animation:
        shadowIn .7s ease-out .55s forwards;
    }

    @keyframes shadowIn {
      to {
        opacity: 1;
      }
    }

    .content {
      position: absolute;

      left: 135px;
      top: 17px;
      right: 12px;

      height: 220px;

      z-index: 5;
    }

    .title {
      margin: 0;

      color: #292a2e;

      font-size: 21px;
      line-height: 1.02;

      font-weight: 800;

      letter-spacing: -.8px;

      white-space: nowrap;

      opacity: 0;

      transform: translateY(7px);

      animation:
        textIn .55s ease-out .75s forwards;
    }

    .subtitle {
      margin-top: 5px;

      color: #56545a;

      font-size: 9px;
      line-height: 1.25;

      font-weight: 500;

      white-space: nowrap;

      opacity: 0;

      transform: translateY(6px);

      animation:
        textIn .5s ease-out .9s forwards;
    }

    @keyframes textIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .rating {
      display: flex;
      align-items: center;

      margin-top: 3px;

      height: 17px;

      opacity: 0;

      transform: translateY(5px);

      animation:
        textIn .5s ease-out 1.02s forwards;
    }

    .stars {
      display: flex;

      gap: 1px;

      color: #f0ad2d;

      font-size: 13px;

      line-height: 1;
    }

    .rating-text {
      margin-left: 5px;

      color: #55545a;

      font-size: 8px;

      font-weight: 500;

      white-space: nowrap;
    }

    .price-row {
      display: flex;

      align-items: baseline;

      margin-top: 25px;

      white-space: nowrap;

      opacity: 0;

      transform: translateY(7px);

      animation:
        priceIn .55s cubic-bezier(.2, .8, .2, 1) 1.2s forwards;
    }

    .price {
      color: #7f79ce;

      font-size: 27px;

      line-height: 1;

      font-weight: 800;

      letter-spacing: -1.5px;
    }

    .old-price {
      margin-left: 7px;

      color: #4c4b4d;

      font-size: 10px;

      line-height: 1;

      font-weight: 500;

      text-decoration: line-through;

      text-decoration-thickness: 1.5px;
    }

    @keyframes priceIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .features {
      position: absolute;

      left: -10px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      width: 158px;

      margin-top: 13px;

      opacity: 0;

      transform: translateY(6px);

      animation:
        textIn .55s ease-out 1.4s forwards;
    }

    .feature {
      display: flex;

      align-items: center;

      min-width: 0;
    }

    .feature-icon {
      width: 35px;
      height: 35px;

      flex: 0 0 35px;

      object-fit: contain;
    }

    .feature-icon.battery,
    .feature-icon.bluetooth {
      padding: 0;
    }

    .feature-text {
      margin-left:-8px;

      color: #414047;

      font-size: 6.5px;

      line-height: 1.05;

      font-weight: 500;

      white-space: nowrap;
    }

    .cta {
      position: absolute;

      left: 0;
      bottom: 9px;

      width: 150px;
      height: 35px;

      display: flex;

      align-items: center;
      justify-content: center;

      border: 0;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          #918bdd 0%,
          #7f79ce 100%
        );

      color: #fff;

      font-family: inherit;

      font-size: 13px;

      line-height: 1;

      font-weight: 750;

      letter-spacing: -.25px;

      cursor: pointer;

      box-shadow:
        0 7px 16px rgba(116, 108, 197, .20);

      overflow: hidden;

      opacity: 0;

      transform: translateY(8px) scale(.97);

      animation:
        ctaIn .6s cubic-bezier(.2, .8, .2, 1) 1.65s forwards;

      transition:
        transform .22s ease,
        box-shadow .22s ease,
        filter .22s ease;
    }

    .cta:hover {
      transform: translateY(-1px) scale(1.025);

      filter: brightness(1.035);

      box-shadow:
        0 9px 20px rgba(116, 108, 197, .28);
    }

    .cta:active {
      transform: translateY(0) scale(.99);
    }

    @keyframes ctaIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .shine {
      position: absolute;

      top: -40px;
      left: -80px;

      width: 42px;
      height: 330px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, .24),
          transparent
        );

      transform: rotate(18deg);

      pointer-events: none;

      z-index: 15;

      animation:
        shineMove 4.8s ease-in-out 2.2s infinite;
    }

    @keyframes shineMove {
      0% {
        left: -80px;
      }

      25%,
      100% {
        left: 350px;
      }
    }

    .banner:focus-visible {
      outline: 2px solid #7f79ce;

      outline-offset: -2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }

      .product-area,
      .discount,
      .title,
      .subtitle,
      .rating,
      .price-row,
      .features,
      .cta {
        opacity: 1;
        transform: none;
      }

      .shine {
        display: none;
      }
    }
  </style>

</head>

<body>

  <div
    class="banner"
    id="banner"
    role="link"
    tabindex="0"
    aria-label="AuraSound Pro — Buy now for $149.99"
  >

<div class="glow"></div>

<div class="glow-right"></div>

<div class="discount">
  −25%
</div>

<div class="product-area">

  <div class="product-shadow"></div>

  <img
    class="product"
    src="AuraSound.png"
    alt="AuraSound Pro"
    draggable="false"
  >

</div>

<div class="content">

  <h1 class="title">
    AuraSound Pro
  </h1>

  <div class="subtitle">
    Premium sound. All-day comfort.
  </div>

  <div class="rating">

    <div
      class="stars"
      aria-label="5 stars"
    >
      ★★★★★
    </div>

    <div class="rating-text">
      4.8 (128)
    </div>

  </div>

  <div class="price-row">

    <div class="price">
      $149.99
    </div>

    <div class="old-price">
      $199.99
    </div>

  </div>

  <div class="features">

    <div class="feature">

      <img
        class="feature-icon"
        src="sound.png"
        alt=""
        draggable="false"
      >

      <span class="feature-text">
        Hi-Res<br>Audio
      </span>

    </div>

    <div class="feature">

      <img
        class="feature-icon"
        src="bat.png"
        alt=""
        draggable="false"
      >

      <span class="feature-text">
        40H<br>Battery
      </span>

    </div>

    <div class="feature">

      <img
        class="feature-icon"
        src="Bluetooth.png"
        alt=""
        draggable="false"
      >

      <span class="feature-text">
        Bluetooth<br>5.3
      </span>

    </div>

  </div>

  <button
    class="cta"
    id="cta"
    type="button"
    aria-label="Add AuraSound Pro to cart"
  >
    <span>
      Add to Cart
    </span>
  </button>

</div>

  <script>
    const banner = document.getElementById("banner");
    const cta = document.getElementById("cta");

    const targetUrl = "https://example.com/";

    function trackClick() {
      console.log("AuraSound banner click");
    }

    function openAd() {
      trackClick();

      window.open(
        targetUrl,
        "_blank",
        "noopener,noreferrer"
      );
    }

    banner.addEventListener("click", function(event) {
      if (event.target.closest("#cta")) {
        return;
      }

      openAd();
    });

    cta.addEventListener("click", function(event) {
      event.stopPropagation();

      openAd();
    });

    banner.addEventListener("keydown", function(event) {
      if (
        event.key === "Enter" ||
        event.key === " "
      ) {
        event.preventDefault();

        openAd();
      }
    });
  </script>

</body>
</html>

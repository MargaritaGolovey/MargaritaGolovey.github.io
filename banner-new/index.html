<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=300,height=250,initial-scale=1.0">
  <title>Мега знижки — Zewa Deluxe</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 300px;
      height: 250px;
      overflow: hidden;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: transparent;
    }

    .banner {
      position: relative;
      width: 300px;
      height: 250px;
      overflow: hidden;
      cursor: pointer;
      isolation: isolate;
      background:
        radial-gradient(
          ellipse at 90% 48%,
          rgba(255, 255, 255, 0.35) 0,
          rgba(255, 255, 255, 0) 35%
        ),
        linear-gradient(
          118deg,
          #e9c72c 0%,
          #dfe55a 23%,
          #a8d36b 42%,
          #65c5a9 61%,
          #45aeca 76%,
          #e5d84d 100%
        );
    }

    .bg-glow {
      position: absolute;
      width: 170px;
      height: 330px;
      left: 72px;
      top: -40px;
      transform: rotate(-26deg);
      pointer-events: none;
      opacity: 0.7;
      filter: blur(1px);
      background:
        linear-gradient(
          90deg,
          transparent 0 42%,
          rgba(37, 132, 202, 0.8) 44% 47%,
          rgba(42, 103, 177, 0.8) 48% 50%,
          rgba(70, 194, 154, 0.65) 51% 54%,
          transparent 56%
        );
    }

    .bg-line {
      position: absolute;
      width: 4px;
      height: 340px;
      left: 126px;
      top: -45px;
      transform: rotate(-27deg);
      background: rgba(255, 255, 255, 0.48);
      filter: blur(0.4px);
      opacity: 0.8;
      pointer-events: none;
    }

    .bg-line.second {
      width: 2px;
      left: 135px;
      opacity: 0.45;
      background: #246db3;
    }

    .headline {
      position: absolute;
      z-index: 4;
      left: 27px;
      top: 40px;
      width: 165px;
    }

    .mega {
      display: inline-block;
      padding: 1px 8px 3px;
      color: #fff;
      background: #050505;
      font-size: 31px;
      line-height: 36px;
      font-weight: 900;
      letter-spacing: -1.8px;
      animation: textIn 0.8s cubic-bezier(.22,.8,.25,1) 0.15s both;
    }

    .sale {
      display: block;
      margin-top: 1px;
      color: #fff;
      font-size: 28px;
      line-height: 31px;
      font-weight: 900;
      letter-spacing: -1.4px;
      animation: textIn 0.8s cubic-bezier(.22,.8,.25,1) 0.35s both;
    }

    .discount {
      position: absolute;
      z-index: 4;
      left: 27px;
      top: 103px;
      width: 125px;
      height: 55px;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      pointer-events: none;
      animation: discountIn 0.8s cubic-bezier(.22,.8,.25,1) 0.55s both;
    }

  .discount-to {
  position: absolute;
  left: 0;
  top: 15px;
  font-size: 13px;
  line-height: 1;
  letter-spacing: -1px;
}

.discount-to::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -7px;
  width: 16px;
  height: 3px;
  background: #fff;
}

.discount-number {
  position: absolute;
  left: 26px;
  top: 14px;
  font-size: 24px;
  line-height: 1;
  letter-spacing: -1px;
}

.discount-percent {
  position: absolute;
  left: 56px;
  top: 17px;
  font-size: 22px;
  line-height: 1;
  letter-spacing: -3px;
}

    .product {
      position: absolute;
      z-index: 3;
      right: -19px;
      top: 98px;
      width: 178px;
      height: 142px;
      object-fit: contain;
      object-position: center;
      filter:
        drop-shadow(0 10px 13px rgba(20, 55, 70, 0.25))
        drop-shadow(0 0 14px rgba(255, 255, 255, 0.2));
      transform-origin: center center;
      animation: productIn 1.45s cubic-bezier(.16,.82,.22,1) 0.1s both;
      will-change: transform, opacity;
    }

    .cta {
      position: absolute;
      z-index: 7;
      left: 27px;
      bottom: 30px;
      min-width: 103px;
      height: 39px;
      padding: 0 18px;
      border: 0;
      border-radius: 5px;
      color: #fff;
      background:
        linear-gradient(
          135deg,
          #075f9c,
          #087fb1
        );
      box-shadow:
        0 7px 16px rgba(0, 70, 120, 0.3),
        inset 0 1px 0 rgba(255,255,255,0.25);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 18px;
      line-height: 39px;
      font-weight: 800;
      cursor: pointer;
      animation: ctaIn 0.8s cubic-bezier(.22,.8,.25,1) 1.35s both;
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        filter 0.25s ease;
    }

    .cta:hover {
      transform: translateY(-2px) scale(1.035);
      box-shadow:
        0 10px 20px rgba(0, 70, 120, 0.38),
        inset 0 1px 0 rgba(255,255,255,0.3);
      filter: brightness(1.08);
    }

    .cta:active {
      transform: translateY(0) scale(0.98);
    }

    @keyframes productIn {
      0% {
        opacity: 0;
        transform: translateX(35px) scale(0.78);
      }

      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes textIn {
      0% {
        opacity: 0;
        transform: translateY(14px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes discountIn {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.94);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes ctaIn {
      0% {
        opacity: 0;
        transform: translateY(14px) scale(0.92);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <div
    class="banner"
    id="banner"
    role="link"
    tabindex="0"
    aria-label="Мега знижки — купити Zewa Deluxe"
  >

    <div class="bg-glow"></div>
    <div class="bg-line"></div>
    <div class="bg-line second"></div>

    <div class="headline">
      <div class="mega">МЕГА</div>
      <div class="sale">ЗНИЖКИ</div>
    </div>

    <div class="discount">
      <div class="discount-to">до</div>
      <div class="discount-number">50</div>
      <div class="discount-percent">%</div>
    </div>

    <img
      class="product"
      id="productImage"
      src="Zewa_Deluxe.png"
      alt="Zewa Deluxe"
      draggable="false"
    >

    <button
      class="cta"
      id="cta"
      type="button"
    >
      Купити
    </button>

  </div>

  <script>
    const banner = document.getElementById("banner");
    const cta = document.getElementById("cta");

    const targetUrl = "https://example.com/product/nova-x1";

    function trackAndOpen(event) {
      event.preventDefault();
      event.stopPropagation();

      window.open(
        targetUrl,
        "_blank",
        "noopener,noreferrer"
      );
    }

    banner.addEventListener("click", function(event) {
      if (event.target !== cta) {
        trackAndOpen(event);
      }
    });

    cta.addEventListener("click", trackAndOpen);

    banner.addEventListener("keydown", function(event) {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        trackAndOpen(event);
      }
    });
  </script>

</body>
</html>
